[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps = 
	adafruit/Adafruit ILI9341@^1.6.0
	adafruit/Adafruit GFX Library@^1.11.9
	arduino-libraries/Servo@^1.3.0
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
	teckel12/NewPing@^1.9.7
	olikraus/U8g2@^2.35.9
	chris--a/Keypad@^3.1.1

